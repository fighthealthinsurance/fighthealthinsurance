# Helm values for self-hosting Temporal Server on the existing cluster, backed
# by the existing PostgreSQL (NO Cassandra, NO Elasticsearch). Use with the
# official chart: https://github.com/temporalio/helm-charts
#
#   helm repo add temporal https://go.temporal.io/helm-charts
#   helm install temporal temporal/temporal -n totallylegitco -f values.yaml
#
# PostgreSQL 12+ provides "advanced visibility" on its own, so we do not need a
# separate Elasticsearch deployment -- a meaningful resource saving on a small
# cluster. See README.md in this directory for the full walkthrough.

# Single combined server process is plenty for current fax volume. Scale the
# individual services (frontend/history/matching/worker) later if needed.
server:
  replicaCount: 1
  config:
    persistence:
      defaultStore: default
      visibilityStore: visibility
      datastores:
        default:
          sql:
            pluginName: "postgres12"
            createDatabase: false   # databases pre-created with owner=temporal
            connectAddr: "${TEMPORAL_PG_HOST}:5432"  # e.g. your existing Postgres service
            connectProtocol: "tcp"
            databaseName: "temporal"
            user: "${TEMPORAL_PG_USER}"
            existingSecret: "temporal-postgres"  # key: password
            maxConns: 20
            # Tuned 2026-08-10: stock chart example was maxIdleConns 20 /
            # maxConnLifetime 1h, which parks 20 idle connections until pg
            # reaps them on idle_session_timeout -- measured on the primary,
            # 46 "terminating connection due to idle-session timeout" entries
            # for temporal@temporal in 6h. Note the timeout differs between
            # config and cluster: k8s/fhi-pg-main-9-cluster.yaml declares
            # 90min, but the running server reports 30min (the parameter
            # needs a Postgres restart, deferred by primaryUpdateStrategy:
            # supervised). 25m sits below both, so Temporal recycles first
            # either way. This workload never needs 20 idle connections;
            # maxConns is unchanged, so burst capacity is untouched.
            maxIdleConns: 5
            maxConnLifetime: "25m"
            manageSchema: true
        visibility:
          sql:
            pluginName: "postgres12"
            createDatabase: false   # databases pre-created with owner=temporal
            connectAddr: "${TEMPORAL_PG_HOST}:5432"
            connectProtocol: "tcp"
            databaseName: "temporal_visibility"
            user: "${TEMPORAL_PG_USER}"
            existingSecret: "temporal-postgres"
            maxConns: 10
            maxIdleConns: 2
            maxConnLifetime: "25m"
            manageSchema: true

# We bring our own Postgres. Chart >= 1.0 no longer bundles Cassandra/ES/
# MySQL/PostgreSQL subcharts, so there is nothing to disable -- external
# datastores are configured entirely via the datastores block above.

# Schema DDL runs against the external Postgres on install/upgrade via
# manageSchema: true on each datastore above (chart >= 1.x replacement for
# the old schema.setup/update toggles).

# Temporal Web UI (browse/inspect workflows). Expose via the existing ingress.
web:
  enabled: true

# Monitoring: chart >= 1.0 no longer bundles Prometheus/Grafana; wire
# Temporal's metrics into the existing Prometheus later if wanted.
