# Helm values for self-hosting Temporal Server on the existing cluster, backed
# by the existing PostgreSQL (NO Cassandra, NO Elasticsearch). Use with the
# official chart: https://github.com/temporalio/helm-charts
#
#   helm repo add temporal https://go.temporal.io/helm-charts
#   helm install temporal temporal/temporal -n totallylegitco -f values.yaml
#
# PostgreSQL 12+ provides "advanced visibility" on its own, so we do not need a
# separate Elasticsearch deployment -- a meaningful resource saving on a small
# cluster. See README.md in this directory for the full walkthrough.

# Single combined server process is plenty for current fax volume. Scale the
# individual services (frontend/history/matching/worker) later if needed.
server:
  replicaCount: 1
  config:
    persistence:
      defaultStore: default
      visibilityStore: visibility
      datastores:
        default:
          sql:
            pluginName: "postgres12"
            createDatabase: false   # databases pre-created with owner=temporal
            connectAddr: "${TEMPORAL_PG_HOST}:5432"  # e.g. your existing Postgres service
            connectProtocol: "tcp"
            databaseName: "temporal"
            user: "${TEMPORAL_PG_USER}"
            existingSecret: "temporal-postgres"  # key: password
            maxConns: 20
            # Tuned off the chart's stock example (20 / 20 / 1h). Parking
            # 20 idle connections is far more than this workload needs, and
            # a lifetime longer than pg's idle_session_timeout means the
            # server severs connections before Temporal recycles them. 25m
            # stays under that timeout whether it is the 30min the server
            # currently reports or the 90min fhi-pg-main-9-cluster.yaml
            # declares. maxConns is unchanged: burst capacity is identical,
            # only the idle pool shrinks.
            maxIdleConns: 5
            maxConnLifetime: "25m"
            manageSchema: true
        visibility:
          sql:
            pluginName: "postgres12"
            createDatabase: false   # databases pre-created with owner=temporal
            connectAddr: "${TEMPORAL_PG_HOST}:5432"
            connectProtocol: "tcp"
            databaseName: "temporal_visibility"
            user: "${TEMPORAL_PG_USER}"
            existingSecret: "temporal-postgres"
            maxConns: 10
            maxIdleConns: 2
            maxConnLifetime: "25m"
            manageSchema: true
    # The server's own Prometheus endpoint, on :9090 in every server pod.
    # These are the chart's defaults, written out so the endpoint the alert
    # rules depend on cannot change under a chart bump. No `framework` key:
    # the server then uses its tally reporter, which keeps counter names as
    # defined (no _total suffix) and reports timer histograms in SECONDS.
    # Verified against temporalio/temporal v1.31.2 (the image chart 1.6.0
    # ships), common/metrics/config.go.
    metrics:
      prometheus:
        timerType: histogram
        listenAddress: "0.0.0.0:9090"
  # Scraping it: one ServiceMonitor per server service (frontend, history,
  # matching, worker), pointed at the headless Services' `metrics` port.
  # Nothing scraped the endpoint before; the worker alerts' server-side group
  # reads these series.
  metrics:
    serviceMonitor:
      enabled: true
      interval: 30s
      # Same selector caveat as the PodMonitors (k8s/fhi-web-podmonitor.yaml):
      # the operator picks a ServiceMonitor up only if its
      # serviceMonitorSelector matches. Mirror any label it requires here.
      additionalLabels:
        app: fight-health-insurance
      # The operator gives every scraped series a `namespace` label (the
      # Kubernetes namespace), so the server's own `namespace` label, the
      # Temporal namespace, arrives renamed to `exported_namespace`. Copy it
      # to `temporal_namespace`, the label the alert rules match on. Series
      # scraped any other way never carry it, so the rules cannot count a
      # second copy of the same series.
      metricRelabelings:
        - action: replace
          sourceLabels:
            - exported_namespace
          targetLabel: temporal_namespace

# We bring our own Postgres. Chart >= 1.0 no longer bundles Cassandra/ES/
# MySQL/PostgreSQL subcharts, so there is nothing to disable -- external
# datastores are configured entirely via the datastores block above.

# Schema DDL runs against the external Postgres on install/upgrade via
# manageSchema: true on each datastore above (chart >= 1.x replacement for
# the old schema.setup/update toggles).

# Temporal Web UI (browse/inspect workflows). Expose via the existing ingress.
web:
  enabled: true
  # Served through the staff-only Django reverse proxy at /timbit/temporal/
  # (see README "Web UI"); the UI never gets its own ingress.
  additionalEnv:
    - name: TEMPORAL_UI_PUBLIC_PATH
      value: /timbit/temporal
    - name: TEMPORAL_DISABLE_WRITE_ACTIONS
      value: "true"

# Monitoring: chart >= 1.0 no longer bundles Prometheus/Grafana. The server's
# metrics reach the cluster's existing Prometheus through the ServiceMonitors
# above (server.metrics.serviceMonitor); see README "Server metrics".
