apiVersion: apps/v1
kind: Deployment
metadata:
  # Named fhi-fax-worker because the Temporal Helm chart already owns a
  # Deployment called "temporal-worker" (the server's internal worker service).
  name: fhi-fax-worker
  namespace: totallylegitco
  labels:
    app: fight-health-insurance-prod
    group: fight-health-insurance-prod-temporal-worker
spec:
  # Two pollers on the queue: a deploy or node failure must never remove
  # every fax poller at once (Temporal queues work for a pollerless queue
  # silently -- external review). Volume is low; two is redundancy, not
  # capacity. Paired with worker-pdb.yaml and the spread constraint below.
  replicas: 2
  selector:
    matchLabels:
      group: fight-health-insurance-prod-temporal-worker
  template:
    metadata:
      labels:
        app: fight-health-insurance-prod
        group: fight-health-insurance-prod-temporal-worker
    spec:
      # Above the worker's 30-minute graceful_shutdown_timeout so a
      # SIGTERM'd pod can finish an in-flight vendor send (bounded by the
      # activity's 30m start_to_close) before the kubelet kills it. Idle
      # pods shut down immediately -- this only delays a rollout while a
      # fax is genuinely mid-send, which is exactly when killing the pod
      # would risk a double-send.
      terminationGracePeriodSeconds: 1860
      # Spread the two replicas across nodes so one node failure cannot take
      # both fax pollers. ScheduleAnyway (not DoNotSchedule): on a one-node
      # cluster the second replica must still schedule.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              group: fight-health-insurance-prod-temporal-worker
      containers:
        - image: ${FHI_BASE}:${FHI_VERSION}
          name: totallylegitco
          # start-server.sh runs `manage.py run_temporal_worker` when this is set.
          ports:
            # Temporal SDK Prometheus metrics (scraped by worker-podmonitor.yaml).
            - name: metrics
              containerPort: 9464
              protocol: TCP
          env:
            - name: TEMPORAL_METRICS_BIND
              value: "0.0.0.0:9464"
            # SSH to FaxyMcFaxFace must go as user "ray" (the account the fax
            # host trusts). asyncssh/paramiko take the default username from
            # getpass.getuser(), which reads USER/LOGNAME before /etc/passwd,
            # so these override the root process identity for SSH only.
            - name: USER
              value: "ray"
            - name: LOGNAME
              value: "ray"
            - name: TEMPORAL_WORKER
              value: "1"
            # This Deployment hosts ONLY the fax queue; appeal work runs in
            # its own Deployment (appeal-worker.yaml) so appeal pressure or a
            # crash-loop cannot take fax sending down (external review).
            - name: TEMPORAL_WORKER_QUEUES
              value: "fax"
            - name: TEMPORAL_ENABLED
              value: "true"
            # In-cluster Temporal frontend (Helm release "temporal" in this ns).
            - name: TEMPORAL_HOST
              value: "temporal-frontend:7233"
            - name: TEMPORAL_NAMESPACE
              value: "default"
            - name: TEMPORAL_TASK_QUEUE
              value: "fhi-fax"
            # DB host from the fhi-db-config ConfigMap (see k8s/db-config.yaml),
            # same as k8s/deploy.yaml: an explicit env entry overrides the STALE
            # PDBHOST still carried by the envFrom Secrets. Without this the
            # worker's activities dial the retired pg8 service and every
            # DB-touching activity fails (found 2026-07-31 during the first
            # end-to-end test).
            - name: PDBHOST
              valueFrom:
                configMapKeyRef:
                  name: fhi-db-config
                  key: PDBHOST
          envFrom:
            # Same DB / app secrets the web + Ray pods use, so activities can
            # reach the database and regenerate fax documents.
            - secretRef:
                name: fight-health-insurance-secret
            - secretRef:
                name: fight-health-insurance-primary-secret
          imagePullPolicy: Always
          # Partial hardening: no privilege escalation, all capabilities
          # dropped. runAsNonRoot / readOnlyRootFilesystem are deferred -- the
          # image entrypoint (start-server.sh) currently runs as root and the
          # worker writes temp fax documents, matching the other manifests.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "250m"
              # The web pods run this SAME image with no memory limit and
              # settle around 1.45Gi, so 1.5Gi is the honest floor for it.
              memory: 1.5Gi
            limits:
              cpu: "1"
              # Double the expected working set. The old 1Gi cap was not a
              # measurement -- fhi-fax-worker's observed 1020Mi was CENSORED
              # by that very ceiling, so its real appetite was never known.
              # Trivial against ~320GB of cluster memory at 4-42% used.
              memory: 3Gi
          volumeMounts:
            # No documents PVC on the rebuilt cluster (2026-07-30): the live
            # web Deployment mounts no uploads claim and
            # new-uploads-longhorn-backup4 does not exist here. Fax activities
            # read documents via the external COMBINED_STORAGE layers or
            # regenerate them.
            # SSH key for the FaxyMcFaxFace backend. The worker process runs
            # locally as root (start-server.sh execs manage.py directly), so
            # ~/.ssh is /root/.ssh -- but it connects to the fax host as REMOTE
            # user "ray" (USER/LOGNAME above), the account setup_faxy_ssh.sh
            # installs the key for. Pre-flight: the fax host must trust the
            # faxymcfaxface-ssh secret's ssh-privatekey for user ray (README
            # checklist).
            - name: faxymcfaxface-ssh
              readOnly: true
              mountPath: "/root/.ssh"
      volumes:
        - name: faxymcfaxface-ssh
          secret:
            secretName: faxymcfaxface-ssh
            # Private key: readable by the root worker process only. Renamed to
            # id_ed25519 because asyncssh/paramiko only auto-offer keys with
            # standard filenames; the secret's own key name (ssh-privatekey)
            # is never searched.
            items:
              - key: ssh-privatekey
                path: id_ed25519
            defaultMode: 0400
