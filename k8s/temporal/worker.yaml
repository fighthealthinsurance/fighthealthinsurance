apiVersion: apps/v1
kind: Deployment
metadata:
  # Named fhi-fax-worker because the Temporal Helm chart already owns a
  # Deployment called "temporal-worker" (the server's internal worker service).
  name: fhi-fax-worker
  namespace: totallylegitco
  labels:
    app: fight-health-insurance-prod
    group: fight-health-insurance-prod-temporal-worker
spec:
  # Faxes are low volume; start with one worker and scale out by raising
  # replicas (Temporal load-balances tasks across all workers on the queue).
  replicas: 1
  selector:
    matchLabels:
      group: fight-health-insurance-prod-temporal-worker
  template:
    metadata:
      labels:
        app: fight-health-insurance-prod
        group: fight-health-insurance-prod-temporal-worker
    spec:
      containers:
        - image: ${FHI_BASE}:${FHI_VERSION}
          name: totallylegitco
          # start-server.sh runs `manage.py run_temporal_worker` when this is set.
          env:
            # SSH to FaxyMcFaxFace must go as user "ray" (the account the fax
            # host trusts). asyncssh/paramiko take the default username from
            # getpass.getuser(), which reads USER/LOGNAME before /etc/passwd,
            # so these override the root process identity for SSH only.
            - name: USER
              value: "ray"
            - name: LOGNAME
              value: "ray"
            - name: TEMPORAL_WORKER
              value: "1"
            - name: TEMPORAL_ENABLED
              value: "true"
            # In-cluster Temporal frontend (Helm release "temporal" in this ns).
            - name: TEMPORAL_HOST
              value: "temporal-frontend:7233"
            - name: TEMPORAL_NAMESPACE
              value: "default"
            - name: TEMPORAL_TASK_QUEUE
              value: "fhi-fax"
          envFrom:
            # Same DB / app secrets the web + Ray pods use, so activities can
            # reach the database and regenerate fax documents.
            - secretRef:
                name: fight-health-insurance-secret
            - secretRef:
                name: fight-health-insurance-primary-secret
          imagePullPolicy: Always
          # Partial hardening: no privilege escalation, all capabilities
          # dropped. runAsNonRoot / readOnlyRootFilesystem are deferred -- the
          # image entrypoint (start-server.sh) currently runs as root and the
          # worker writes temp fax documents, matching the other manifests.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "250m"
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            # No documents PVC on the rebuilt cluster (2026-07-30): the live
            # web Deployment mounts no uploads claim and
            # new-uploads-longhorn-backup4 does not exist here. Fax activities
            # read documents via the external COMBINED_STORAGE layers or
            # regenerate them.
            # SSH key for the FaxyMcFaxFace backend. The worker process runs
            # locally as root (start-server.sh execs manage.py directly), so
            # ~/.ssh is /root/.ssh -- but it connects to the fax host as REMOTE
            # user "ray" (USER/LOGNAME above), the account setup_faxy_ssh.sh
            # installs the key for. Pre-flight: the fax host must trust the
            # faxymcfaxface-ssh secret's ssh-privatekey for user ray (README
            # checklist).
            - name: faxymcfaxface-ssh
              readOnly: true
              mountPath: "/root/.ssh"
      volumes:
        - name: faxymcfaxface-ssh
          secret:
            secretName: faxymcfaxface-ssh
            # Private key: readable by the root worker process only. Renamed to
            # id_ed25519 because asyncssh/paramiko only auto-offer keys with
            # standard filenames; the secret's own key name (ssh-privatekey)
            # is never searched.
            items:
              - key: ssh-privatekey
                path: id_ed25519
            defaultMode: 0400
