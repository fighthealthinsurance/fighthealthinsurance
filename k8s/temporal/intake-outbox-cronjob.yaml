apiVersion: batch/v1
kind: CronJob
metadata:
  # Intake outbox relay: every minute, re-deliver intake-journey events
  # (IntakeJourneyEvent rows) whose Temporal ack never landed, with backoff
  # per row. Its own process by design -- a hook inside the web or Ray pods
  # would die with the very crash the outbox exists to survive (external
  # review). Inert while the intake journey flags are off. Applied by
  # scripts/build.sh next to the worker manifests.
  name: fhi-intake-outbox-relay
  namespace: totallylegitco
spec:
  schedule: "* * * * *"
  # Never overlap two relays; a run that misses its slot by more than a
  # minute is simply skipped (the next one picks the rows up).
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 60
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      # Hard ceiling on one run: the command stops STARTING rows after its
      # ~240s budget and every Temporal call carries a ~15s timeout, so no
      # single call and no long backlog can consume the job's lifetime.
      activeDeadlineSeconds: 300
      ttlSecondsAfterFinished: 600
      template:
        metadata:
          labels:
            group: fight-health-insurance-prod-webbackend-batch
        spec:
          containers:
            - image: ${FHI_BASE}:${FHI_VERSION}
              name: totallylegitco
              # start-server.sh runs the relay command when this is set.
              env:
                - name: DELIVER_INTAKE_EVENTS
                  value: "1"
                - name: PDBHOST
                  valueFrom:
                    configMapKeyRef:
                      name: fhi-db-config
                      key: PDBHOST
              envFrom:
                - secretRef:
                    name: fight-health-insurance-secret
                - secretRef:
                    name: fight-health-insurance-primary-secret
              imagePullPolicy: Always
              # Same partial hardening as the worker manifests; runAsNonRoot /
              # readOnlyRootFilesystem stay deferred with the rest of the fleet.
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
                seccompProfile:
                  type: RuntimeDefault
              # Sized from a measurement, not a guess. Peak RSS of
              # `manage.py deliver_intake_events` measured in a live web pod
              # was ~1072 MiB. That run was on the inert path (the intake flag
              # was off, so it delivered nothing), which makes it a floor, not
              # a ceiling: it is the Django/ML import footprint every pod on
              # this image pays before doing any work at all. That floor alone
              # was already double the old 512Mi limit, which is why the relay
              # was OOMKilled ~4s in, during import, before ever reaching
              # deliver_intake_events. Matched to fhi-fax-worker and
              # fhi-appeal-worker (1536Mi / 3Gi), the two workloads that run
              # this same image as a long-lived process, so the limit carries
              # real headroom over the import floor once delivery does work.
              resources:
                requests:
                  cpu: "100m"
                  memory: 1536Mi
                limits:
                  cpu: "500m"
                  memory: 3Gi
          restartPolicy: Never
