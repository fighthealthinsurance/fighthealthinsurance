<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Time for a break - Letter review</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 900px;
      margin: 0 auto;
      padding: 20px 16px;
      background-color: #f5f5f5;
      color: #222;
      line-height: 1.6;
      font-size: 18px;
    }
    h1 {
      color: #222;
      border-bottom: 2px solid #0b5394;
      padding-bottom: 10px;
      overflow-wrap: anywhere;
    }
    .lr-break {
      background: #ffffff;
      color: #222;
      border: 1px solid #d5d9de;
      border-radius: 8px;
      padding: 16px 18px;
    }
    .lr-break progress { width: 100%; max-width: 420px; height: 12px; }
    .lr-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
    a.lr-go {
      display: inline-block;
      padding: 9px 16px;
      border-radius: 4px;
      background-color: #0b5394;
      color: #ffffff;
      text-decoration: none;
    }
    a.lr-go:hover, a.lr-go:focus { background-color: #083b6a; color: #ffffff; }
    a.lr-plain { color: #0b5394; padding: 9px 4px; }
  </style>
</head>
<body>
  <h1>Time for a short break</h1>
  <div class="lr-break">
    <p>A short pause every {{ break_every }} letters: stand up, look at something far away, get some water.</p>
    <p><progress max="{{ assigned }}" value="{{ labeled }}" aria-label="Letters done">{{ labeled }} of {{ assigned }}</progress><br>
      {{ labeled }} of {{ assigned }} done in {{ packet.name }}.</p>
    <div class="lr-actions">
      <a class="lr-go" href="{% if following %}{% url 'letter_review_item' packet.pk following.slug %}{% else %}{% url 'letter_review_next' packet.pk %}{% endif %}">Next letter</a>
      <a class="lr-plain" href="{% url 'letter_review_mine' packet.pk %}">My letters</a>
      <a class="lr-plain" href="{% url 'letter_review_index' %}">All packets</a>
    </div>
  </div>
</body>
</html>
