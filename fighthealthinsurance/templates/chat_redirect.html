<!DOCTYPE html>
<html>
<head>
    <title>Redirecting to Chat...</title>
</head>
<body>
    <p>Redirecting to chat...</p>
    <form id="chatRedirectForm" method="POST" action="{{ chat_url }}">
        {% csrf_token %}
        {% if denial_text %}
        <textarea name="denial_text" style="display:none;">{{ denial_text }}</textarea>
        {% endif %}
        {% if initial_message %}
        <textarea name="initial_message" style="display:none;">{{ initial_message }}</textarea>
        {% endif %}
        {# Funnel params (CHAT_FUNNEL_PARAMS) preserved as hidden fields #}
        {% for name, value in funnel_params %}
        <input type="hidden" name="{{ name }}" value="{{ value }}">
        {% endfor %}
    </form>
    <script>
        // Auto-submit the form
        document.getElementById('chatRedirectForm').submit();
    </script>
</body>
</html>
