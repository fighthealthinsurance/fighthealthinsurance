name: Update State Resources

# Refreshes the state-by-state Medicare and Medicaid help index that
# scripts/state_data/extract_info.py builds (see scripts/state_data/README.md):
#
#   * data/state_medicaid_medicare_resources.json - for each state, the URL of
#     every resource category (SHIP, Senior Medicare Patrol, fair hearing
#     portal, ...) plus the LSC legal aid grantee profiles. Only entries that
#     are still missing are searched for again.
#   * data/extracted_state_resources.json - the agencies, phone numbers,
#     deadlines and filing notes a model extracts from each of those pages.
#
# Agencies move, change their phone numbers and retire pages, so we refresh
# the data on a schedule and open a pull request with the change for review.
# The pages are public and nothing here is patient data, so a hosted model
# does the extraction: the self-hosted backends the app uses are reachable
# only inside the cluster.

on:
  schedule:
    # 07:00 UTC on the 2nd day of every month (the browser data refresh takes
    # the 1st). The extraction is about 430 model calls, well under a dollar.
    - cron: "0 7 2 * *"
  # Allow maintainers to trigger the refresh on demand from the Actions tab.
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-state-resources
  cancel-in-progress: false

env:
  # The OpenAI-compatible endpoints and models the script extracts with.
  #
  # LunaRoute's DeepSeek 4.1 Flash is preferred when the LUNA_ROUTE_KEY secret
  # is set (the pages are public, so this is the synthetic-only kind of work
  # LunaRoute is kept to; see docs/ml-backends.md). The script calls it one
  # page at a time, which is all LunaRoute serves per model. The hosted
  # endpoint below (DeepInfra, with the model the app's router uses there)
  # is then the fallback: a page whose LunaRoute call fails is retried on
  # it, and after a few failures in a row the rest of the run goes to it
  # directly. Without LUNA_ROUTE_KEY the hosted endpoint does the whole run.
  #
  # Repository variables override the defaults; the keys are repository
  # secrets. For the hosted endpoint a dedicated STATE_RESOURCES_API_KEY wins,
  # else the DEEPINFRA_API key is reused. Setting STATE_RESOURCES_BACKEND_URL
  # names one endpoint to use and turns LunaRoute off. The keys themselves
  # are set only on the step that calls the model (below), so the unpinned
  # packages pip installs never run with them in their environment; the job
  # sees only whether each is configured.
  HOSTED_BACKEND_URL: ${{ vars.STATE_RESOURCES_BACKEND_URL || 'https://api.deepinfra.com/v1/openai' }}
  HOSTED_BACKEND_MODEL: ${{ vars.STATE_RESOURCES_MODEL || 'google/gemma-4-26B-A4B-it' }}
  HAS_HOSTED_KEY: ${{ (secrets.STATE_RESOURCES_API_KEY || secrets.DEEPINFRA_API) != '' }}
  LUNAROUTE_URL: https://gw.lunaroute.com/v1
  LUNAROUTE_MODEL: ${{ vars.STATE_RESOURCES_LUNAROUTE_MODEL || 'deepseek-4.1-flash' }}
  USE_LUNAROUTE: ${{ secrets.LUNA_ROUTE_KEY != '' && vars.STATE_RESOURCES_BACKEND_URL == '' }}

jobs:
  update-state-resources:
    runs-on: ubuntu-latest
    # About 430 pages, each a fetch plus a model call: a healthy run should
    # finish in around two hours. The script allows each page up to five
    # minutes, so a run full of slow sites could take far longer; cap it well
    # inside GitHub's six-hour limit. The script rewrites its output after
    # every state, so a run cut off here fails the job and the steps below
    # never open a pull request from the partial file.
    timeout-minutes: 300
    steps:
      - name: Check that a model key is configured
        if: env.USE_LUNAROUTE != 'true' && env.HAS_HOSTED_KEY != 'true'
        run: |
          echo "::error::No model key: add the LUNA_ROUTE_KEY repository secret (LunaRoute, preferred), or STATE_RESOURCES_API_KEY (or DEEPINFRA_API), a key for the endpoint in STATE_RESOURCES_BACKEND_URL (DeepInfra by default)."
          exit 1

      - name: Report the model backends
        run: |
          if [ "$USE_LUNAROUTE" = "true" ]; then
            echo "Primary: $LUNAROUTE_MODEL at $LUNAROUTE_URL"
            if [ "$HAS_HOSTED_KEY" = "true" ]; then
              echo "Fallback: $HOSTED_BACKEND_MODEL at $HOSTED_BACKEND_URL"
            else
              echo "::warning::No STATE_RESOURCES_API_KEY or DEEPINFRA_API secret, so there is no fallback if LunaRoute fails."
            fi
          else
            echo "Primary: $HOSTED_BACKEND_MODEL at $HOSTED_BACKEND_URL (no fallback)"
          fi

      - uses: actions/checkout@v4
        with:
          # Don't leave the job's write token in the local git config: the
          # steps below run third-party Python packages, and
          # create-pull-request authenticates its own push via its `token`
          # input, so nothing here needs persisted checkout credentials.
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install the script's dependencies
        run: pip install -r scripts/state_data/requirements.txt

      - name: Refresh the state resource index and the extracted resources
        env:
          HEALTH_BACKEND_URL: ${{ env.USE_LUNAROUTE == 'true' && env.LUNAROUTE_URL || env.HOSTED_BACKEND_URL }}
          HEALTH_BACKEND_MODEL: ${{ env.USE_LUNAROUTE == 'true' && env.LUNAROUTE_MODEL || env.HOSTED_BACKEND_MODEL }}
          HEALTH_BACKEND_API_KEY: ${{ env.USE_LUNAROUTE == 'true' && secrets.LUNA_ROUTE_KEY || secrets.STATE_RESOURCES_API_KEY || secrets.DEEPINFRA_API }}
          # Empty unless LunaRoute is the primary and a hosted key exists.
          HEALTH_BACKEND_FALLBACK_URL: ${{ env.USE_LUNAROUTE == 'true' && env.HAS_HOSTED_KEY == 'true' && env.HOSTED_BACKEND_URL || '' }}
          HEALTH_BACKEND_FALLBACK_MODEL: ${{ env.USE_LUNAROUTE == 'true' && env.HAS_HOSTED_KEY == 'true' && env.HOSTED_BACKEND_MODEL || '' }}
          HEALTH_BACKEND_FALLBACK_API_KEY: ${{ env.USE_LUNAROUTE == 'true' && (secrets.STATE_RESOURCES_API_KEY || secrets.DEEPINFRA_API) || '' }}
        run: python scripts/state_data/extract_info.py

      - name: Refuse a run that lost most of the data
        # The script logs a failed fetch or model call and moves on, so a dead
        # endpoint or a rejected key "succeeds" with an almost empty file.
        # Fail instead of opening a pull request that deletes the data.
        run: |
          set -euo pipefail
          total() { jq '[.[].resource_count] | add // 0'; }
          before=$(git show HEAD:data/extracted_state_resources.json | total)
          after=$(total < data/extracted_state_resources.json)
          echo "Extracted resources before: $before, after: $after"
          if [ "$after" -eq 0 ] || [ "$after" -lt $(( before / 2 )) ]; then
            echo "::error::The refresh kept $after of $before resources (fewer than half); not opening a pull request. Check the model endpoints and keys in the step above."
            exit 1
          fi

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          # Prefer a PAT (the same BROWSERSLIST_UPDATE_TOKEN the browser data
          # refresh uses) so the resulting PR triggers the CI workflows; fall
          # back to the default GITHUB_TOKEN, which opens the PR but (by
          # design) will not kick off other workflows.
          token: ${{ secrets.BROWSERSLIST_UPDATE_TOKEN || github.token }}
          add-paths: |
            data/state_medicaid_medicare_resources.json
            data/extracted_state_resources.json
          branch: chore/update-state-resources
          delete-branch: true
          commit-message: "chore(data): refresh the state Medicare and Medicaid resources"
          title: "chore(data): refresh the state Medicare and Medicaid resources"
          body: |
            Automated monthly refresh of the state-by-state Medicare and
            Medicaid help data, made by `scripts/state_data/extract_info.py`
            against a hosted model:

            * `data/state_medicaid_medicare_resources.json`: resource URLs per
              state. Only entries that were missing were searched for again.
            * `data/extracted_state_resources.json`: the agencies, phone
              numbers, deadlines and notes extracted from those pages.

            Review notes:

            * The extraction is a model reading each page, so some of the
              diff is rephrased notes rather than changed facts. Look for
              agencies that disappeared, new phone numbers and changed URLs.
            * A state whose pages were unreachable this run can lose
              resources. If a drop looks wrong, re-run the workflow from the
              Actions tab; it updates this pull request in place.

            Opened automatically by the `Update State Resources` workflow. If
            nothing changed, this pull request is not created.
