        run: uv tool install tox --with tox-uv

      - name: Install pandoc
        uses: pandoc/actions/setup@v1
        with:
          version: 2.19

      - name: Build npm js (needed for the e2e tests in django)
        run:
          ./scripts/ci_npm_build.sh

      - name: Setup DB (long story)
        run: ./scripts/ci_setup_db.sh

      - name: Run tests
        run: ENVIRONMENT=Test tox -e py${{ matrix.toxpy }}-django${{ matrix.django }}-async
        env:
          FARTS: "farts"
          GOOGLE_CLIENT_SECRETS_TEXT: ${{ secrets.GOOGLE_CLIENT_SECRETS_TEXT }}
          STRIPE_TEST_SECRET_KEY: ${{ secrets.STRIPE_TEST_SECRET_KEY }}
          NOSTRIPE: true


