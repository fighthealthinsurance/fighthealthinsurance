name: Run CI

on:
  push:
    branches:
      - "main"

  pull_request:
    branches:
      - "**"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  # Selenium is by far the slowest check (~12 min against 40s-7min for
  # everything else): it installs texlive, tesseract and pandoc, then drives a
  # real browser through 97 tests. Most of that cost is wasted on changes it
  # cannot possibly exercise -- a k8s manifest, a markdown file, a mypy
  # setting. This job decides whether it needs to run at all.
  #
  # DENY-list, not an allow-list: anything not explicitly listed as irrelevant
  # runs Selenium. Being wrong in that direction costs 12 minutes; being wrong
  # the other way ships a broken form (a client-side gate regression was caught
  # by this suite and nothing else).
  changes:
    runs-on: ubuntu-latest
    outputs:
      ui: ${{ steps.filter.outputs.ui }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: filter
        run: |
          set -uo pipefail
          # FAIL-SAFE: this script must never leave ui unset or fail. If the
          # filter itself breaks, "skipped" would satisfy a required Selenium
          # check and merge unverified code -- so any problem runs the suite
          # (external review).
          run_it() { echo "ui=true" >> "$GITHUB_OUTPUT"; exit 0; }
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            run_it   # push to main, merge_group, anything else
          fi
          base="${{ github.event.pull_request.base.sha }}"
          [ -n "$base" ] || run_it
          # --no-renames: with rename detection a file moved INTO a denied
          # directory is reported only by its destination, so its removal from
          # a live path goes unseen. Report both sides instead.
          files=$(git diff --no-renames --name-only "$base"...HEAD) || run_it
          echo "changed files:"; echo "$files" | sed 's/^/  /'
          [ -n "$files" ] || run_it
          # Paths that cannot reach a browser. Narrow on purpose:
          #  - scripts/ is NOT here: a build script can change the JS bundle.
          #  - .github/ is NOT here: a CI change should exercise the job it edits.
          #  - Markdown is denied only OUTSIDE the app package, since a .md file
          #    under fighthealthinsurance/ may be fetched and rendered.
          #  - k8s/ and charts/ change DEPLOYED config (flags, STATIC_URL, CSP).
          #    That can absolutely change a real page; it cannot change the page
          #    this suite renders, which runs against a local server.
          irrelevant='^(k8s/|charts/|docs/[^/]*\.md$|[^/]*\.md$|mypy\.ini$|\.gitignore$)'
          if echo "$files" | grep -qvE "$irrelevant"; then
            run_it
          fi
          echo "ui=false" >> "$GITHUB_OUTPUT"
          echo "Only Selenium-irrelevant paths changed; skipping the browser suite."

  style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          persist-credentials: false

      - uses: actions/setup-python@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install system level packages
        run: (sudo apt-get update || echo "sometimes this fails because of the azure cli repo which we do not use") && sudo apt-get install -y  libgirepository1.0-dev pkg-config python3-dev && sudo apt-get clean

      - name: Install dependencies
        run: uv tool install tox --with tox-uv

      - name: Check style
        run:
          tox -e black

  shell-linter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          persist-credentials: false
      - name: Install shell check
        run: sudo apt-get install -y shellcheck
      - name: Run shellcheck
        run: ./scripts/check_shell_style.sh

  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          persist-credentials: false

      - uses: actions/setup-python@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          
      - name: Install system level packages
        run: (sudo apt-get update || echo "sometimes this fails because of the azure cli repo which we do not use") && sudo apt-get install -y  libgirepository1.0-dev pkg-config python3-dev && sudo apt-get clean

      - name: Install tox
        run: uv tool install tox --with tox-uv

      - name: Check types
        run:
          tox -e mypy

  npm-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          lfs: true
          persist-credentials: false
      - name: Setup node
        uses: actions/setup-node@v6

      - name: Check npm build
        run: ./scripts/ci_npm_build.sh


  tests-sync:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
#          - python: '3.12'
#            toxpy: '312'
#            django: '52'
          - python: '3.13'
            toxpy: '313'
            django: '52'

    name: Run the sync test suite (Python ${{ matrix.python }}, Django ${{ matrix.django }})
    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf ~/.rustup
          sudo docker image prune -a -f
          sudo apt-get clean
          df -h

      - uses: actions/checkout@v4
        with:
          lfs: true
          persist-credentials: false

      - name: Setup node
        uses: actions/setup-node@v3

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('fighthealthinsurance/static/js/package-lock.json') }}
          restore-keys: npm-

      - name: Install system level packages
        run: (sudo apt-get update || echo "apt-get update failed, continuing with existing package lists...") && sudo apt-get install -y tesseract-ocr texlive libgirepository1.0-dev pkg-config python3-dev && sudo apt-get clean

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Cache uv dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/uv
            .tox
          key: uv-${{ matrix.python }}-${{ hashFiles('requirements.txt', 'requirements-dev.txt') }}
          restore-keys: |
            uv-${{ matrix.python }}-

      - name: Install tox
        run: uv tool install tox --with tox-uv

      - name: Install pandoc
        uses: pandoc/actions/setup@v1
        with:
          version: 2.19

      - name: Build npm js (needed for the e2e tests in django)
        run:
          ./scripts/ci_npm_build.sh

      - name: Run tests
        run: tox -e py${{ matrix.toxpy }}-django${{ matrix.django }}-sync
        env:
          FARTS: "farts"
          GOOGLE_CLIENT_SECRETS_TEXT: ${{ secrets.GOOGLE_CLIENT_SECRETS_TEXT }}
          STRIPE_TEST_SECRET_KEY: ${{ secrets.STRIPE_TEST_SECRET_KEY }}

  tests-selenium:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.ui == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
#          - python: '3.11'
#            toxpy: '311'
#            django: '52'
#          - python: '3.12'
#            toxpy: '312'
#            django: '52'
          - python: '3.13'
            toxpy: '313'
            django: '52'

    name: Run the Selenium test suite (Python ${{ matrix.python }}, Django ${{ matrix.django }})
    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf ~/.rustup
          sudo docker image prune -a -f
          sudo apt-get clean
          df -h

      - uses: actions/checkout@v4
        with:
          lfs: true
          persist-credentials: false

      - name: Setup node
        uses: actions/setup-node@v3

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('fighthealthinsurance/static/js/package-lock.json') }}
          restore-keys: npm-

      - name: Install system level packages
        run: (sudo apt-get update || echo "apt-get update failed, continuing with existing package lists...") && sudo apt-get install -y tesseract-ocr texlive libgirepository1.0-dev pkg-config python3-dev && sudo apt-get clean

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Cache uv dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/uv
            .tox
          key: uv-${{ matrix.python }}-${{ hashFiles('requirements.txt', 'requirements-dev.txt') }}
          restore-keys: |
            uv-${{ matrix.python }}-

      - name: Install tox
        run: uv tool install tox --with tox-uv

      - name: Install pandoc
        uses: pandoc/actions/setup@v1
        with:
          version: 2.19

      - name: Run selenium tests
        run: tox -e py${{ matrix.toxpy }}-django${{ matrix.django }}-selenium
        env:
          FARTS: "farts"
          GOOGLE_CLIENT_SECRETS_TEXT: ${{ secrets.GOOGLE_CLIENT_SECRETS_TEXT }}
          STRIPE_TEST_SECRET_KEY: ${{ secrets.STRIPE_TEST_SECRET_KEY }}

  tests-sync-actor:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
#          - python: '3.11'
#            toxpy: '311'
#            django: '52'
#          - python: '3.12'
#            toxpy: '312'
#            django: '52'
          - python: '3.13'
            toxpy: '313'
            django: '52'
    name: Run the sync actor test suite (Python ${{ matrix.python }}, Django ${{ matrix.django }})
    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost ~/.rustup
          sudo docker image prune -a -f
          sudo apt-get clean
          df -h

      - uses: actions/checkout@v4
        with:
          lfs: true
          persist-credentials: false

      - name: Setup node
        uses: actions/setup-node@v3

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('fighthealthinsurance/static/js/package-lock.json') }}
          restore-keys: npm-

      - name: Install system level packages
        run: (sudo apt-get update || echo "apt-get update failed, continuing with existing package lists...") && sudo apt-get install -y tesseract-ocr texlive libgirepository1.0-dev pkg-config python3-dev && sudo apt-get clean

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Cache uv dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/uv
            .tox
          key: uv-${{ matrix.python }}-${{ hashFiles('requirements.txt', 'requirements-dev.txt') }}
          restore-keys: |
            uv-${{ matrix.python }}-

      - name: Install tox
        run: uv tool install tox --with tox-uv

      - name: Install pandoc
        uses: pandoc/actions/setup@v1
        with:
          version: 2.19

      - name: Build npm js (needed for the e2e tests in django)
        run:
          ./scripts/ci_npm_build.sh

      - name: Run tests
        run: tox -e py${{ matrix.toxpy }}-django${{ matrix.django }}-sync-actor
        env:
          FARTS: "farts"
          GOOGLE_CLIENT_SECRETS_TEXT: ${{ secrets.GOOGLE_CLIENT_SECRETS_TEXT }}
          STRIPE_TEST_SECRET_KEY: ${{ secrets.STRIPE_TEST_SECRET_KEY }}


