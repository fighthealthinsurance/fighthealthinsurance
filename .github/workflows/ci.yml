  tests-async:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
#          - python: '3.11'
#            toxpy: '311'
#            django: '52'
#          - python: '3.12'
#            toxpy: '312'
#            django: '52'
          - python: '3.13'
            toxpy: '313'
            django: '52'

    name: Run the async test suite (Python ${{ matrix.python }}, Django ${{ matrix.django }})
    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost ~/.rustup
          sudo docker image prune -a -f
          sudo apt-get clean
          df -h

      - uses: actions/checkout@v4
        with:
          lfs: true
          persist-credentials: false

      - name: Setup node
        uses: actions/setup-node@v3

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('fighthealthinsurance/static/js/package-lock.json') }}
          restore-keys: npm-

      - name: Install system level packages
        run: (sudo apt-get update || echo "apt-get update failed, continuing with existing package lists...") && sudo apt-get install -y tesseract-ocr texlive libgirepository1.0-dev pkg-config python3-dev && sudo apt-get clean

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Cache uv dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/uv
            .tox
          key: uv-${{ matrix.python }}-${{ hashFiles('requirements.txt', 'requirements-dev.txt') }}
          restore-keys: |
            uv-${{ matrix.python }}-

