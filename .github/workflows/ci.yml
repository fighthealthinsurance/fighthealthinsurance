      - name: Cache uv dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/uv
            .tox
          key: uv-${{ matrix.python }}-${{ hashFiles('requirements.txt', 'requirements-dev.txt') }}
          restore-keys: |
            uv-${{ matrix.python }}-

      - name: Install tox
        run: uv tool install tox --with tox-uv

      - name: Install pandoc
        uses: pandoc/actions/setup@v1
        with:
          version: 2.19

      - name: Build npm js (needed for the e2e tests in django)
        run:
          ./scripts/ci_npm_build.sh

      - name: Setup DB (long story)
        run: ./scripts/ci_setup_db.sh

      - name: Run tests
        run: ENVIRONMENT=Test tox -e py${{ matrix.toxpy }}-django${{ matrix.django }}-async-unit
        env:
          FARTS: "farts"
