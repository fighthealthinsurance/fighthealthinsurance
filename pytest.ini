[pytest]
DJANGO_SETTINGS_MODULE = fighthealthinsurance.settings
DJANGO_CONFIGURATION = Dev
asyncio_mode = strict
asyncio_default_test_loop_scope = function
asyncio_default_fixture_loop_scope = function
# A test still running after this many seconds gets every thread's traceback
# dumped to stderr (it keeps running). A hung xdist worker otherwise prints
# nothing until the CI job times out, with no test name to go on.
faulthandler_timeout = 300
